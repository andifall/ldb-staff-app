<style>
  :root{ --cream:#FAF8F3; --bark:#3D2B1F; --blush:#F0E8DF; --golden:#FFBE5C; --paw:#C8A882; --sage:#8A9E7A;
    --bark70:rgba(61,43,31,.70); --bark55:rgba(61,43,31,.55); --bark15:rgba(61,43,31,.15); --bark10:rgba(61,43,31,.10);
    --danger:#B4433A; --danger-bg:#F7E7E2; --sage-bg:#E9EEE3; --sage-tx:#4E6140;

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:var(--body);color:var(--bark);background:var(--blush);line-height:1.5;font-size:16px}
  .app{max-width:720px;margin:0 auto;min-height:100vh;background:var(--cream);display:flex;flex-direction:column;box-shadow:0 0 60px rgba(61,43,31,.08)}
  header.topbar{position:sticky;top:0;z-index:20;background:var(--bark);display:flex;align-items:center;gap:12px;
    padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));border-bottom:1px solid rgba(0,0,0,.15)}
  .brand{font-family:var(--head);font-weight:800;color:var(--cream);text-transform:uppercase;letter-spacing:.04em;font-size:16px}
  .brand small{display:block;font-size:10px;letter-spacing:.14em;color:var(--golden);font-weight:600}
  .topbar .right{margin-left:auto;display:flex;gap:8px;align-items:center}
  .content{flex:1;padding:18px 16px 60px}
  h1.page{font-family:var(--head);font-weight:800;font-size:24px;margin:6px 0 4px;text-transform:uppercase;letter-spacing:.01em;line-height:1.08}
  .sub{color:var(--bark55);font-size:14px;margin:0 0 18px}
  .eyebrow{font-family:var(--head);color:var(--paw);font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:12px;margin:24px 0 10px}
  label.q{display:block;font-weight:600;font-size:13px;margin:0 0 5px;color:var(--bark70)}
  input[type=text],input[type=email],input[type=password],textarea{width:100%;font-family:var(--body);font-size:15px;color:var(--bark);
    background:#fff;border:1px solid var(--bark15);border-radius:12px;padding:12px 14px;outline:none}
  input:focus,textarea:focus{border-color:var(--golden);box-shadow:0 0 0 3px rgba(255,190,92,.25)}
  textarea{resize:vertical;min-height:120px;line-height:1.5;white-space:pre-wrap}
  .field{margin-bottom:14px}
  button{font-family:var(--head);font-weight:700;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;border:none;border-radius:12px}
  .btn{background:var(--bark);color:var(--cream);padding:13px 18px;font-size:14px}
  .btn:active{transform:translateY(1px)}
  .btn.gold{background:var(--golden);color:var(--bark)}
  .btn.ghost{background:transparent;color:var(--cream);border:1px solid rgba(250,248,243,.4);padding:8px 14px;font-size:12px}
  .btn.ghost.dark{color:var(--bark);border-color:var(--bark15)}
  .btn.sm{padding:8px 12px;font-size:12px}
  .btn.block{width:100%;padding:15px;font-size:15px}
  .btn[disabled]{opacity:.5}
  .card{background:#fff;border:1px solid var(--bark10);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
  .doc-row{display:flex;align-items:center;gap:12px}
  .doc-row .meta{flex:1;min-width:0}
  .doc-row .t{font-family:var(--head);font-weight:700;font-size:16px;color:var(--bark)}
  .doc-row .d{font-size:12.5px;color:var(--bark55);margin-top:2px}
  .badge{display:inline-block;font-family:var(--head);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:10px;
    padding:3px 8px;border-radius:999px;vertical-align:1px}
  .badge.store{background:var(--blush);color:var(--bark70)}
  .badge.edited{background:var(--sage-bg);color:var(--sage-tx)}
  .badge.default{background:#F2ECE2;color:var(--paw)}
  .sec-card{background:#fff;border:1px solid var(--bark15);border-radius:14px;padding:14px;margin-bottom:12px}
  .sec-tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .sec-tools button{background:var(--blush);color:var(--bark);padding:7px 11px;font-size:11px}
  .sec-tools button.del{background:var(--danger-bg);color:var(--danger)}
  .hint{font-size:12px;color:var(--bark55);margin:4px 0 0}
  .bar{position:sticky;bottom:0;background:linear-gradient(to top,var(--cream) 70%,rgba(250,248,243,0));padding:14px 0 8px;margin-top:8px}
  .msg{font-size:13px;padding:10px 14px;border-radius:10px;margin:10px 0}
  .msg.ok{background:var(--sage-bg);color:var(--sage-tx)} .msg.err{background:var(--danger-bg);color:var(--danger)}
  .center{min-height:70vh;display:flex;flex-direction:column;justify-content:center}
  .muted{color:var(--bark55);font-size:13px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--bark);color:var(--cream);
    padding:12px 18px;border-radius:999px;font-size:14px;box-shadow:var(--shadow-lg);opacity:0;transition:opacity .2s;z-index:60}
  .toast.show{opacity:1}
  a.link{color:var(--bark);font-size:13px}
</style>

const $=s=>document.querySelector(s);
const esc=s=>(s==null?"":String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const root=()=>$("#root");
var user=null, overrides={}, formOv={}, W=null, WF=null, curKey=null, curForm=null, ovUnsub=null, fovUnsub=null, pickStore=null;

function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("show"); setTimeout(()=>el.classList.remove("show"),2200); }

/* ---------- auth ---------- */
if(auth){
  auth.onAuthStateChanged(u=>{
    if(u && ALLOWED.includes((u.email||"").toLowerCase())){ user={email:u.email.toLowerCase(),scope:SCOPE[u.email.toLowerCase()]}; startOverrides(); renderTop(); renderList(); }
    else { user=null; if(u){ try{auth.signOut();}catch(e){} } renderTop(); renderLogin(u?("This account ("+esc(u.email)+") is not a management login."):""); }
  });
} else { renderLogin("This device can't reach the database right now."); }

function renderTop(){
  const r=$("#topRight");
  if(user){ r.innerHTML=`<span class="badge store" style="color:var(--golden);background:transparent;border:1px solid rgba(250,248,243,.4)">${esc(user.scope==='ALL'?'All stores':user.scope)}</span><button class="btn ghost" onclick="window._logout()">Log out</button>`; }
  else { r.innerHTML=""; }
}
window._logout=function(){ try{auth.signOut();}catch(e){} curKey=null; W=null; curForm=null; WF=null; };

function renderLogin(err){
  curKey=null; W=null;
  root().innerHTML=`<div class="center">
    <h1 class="page">Sign in</h1>
    <p class="sub">Management login only. Changes you make here update the staff app live.</p>
    <div class="field"><label class="q">Email</label><input type="email" id="e" autocomplete="username" placeholder="brighton@ldbrighton.com"></div>
    <div class="field"><label class="q">Password</label><input type="password" id="p" autocomplete="current-password"></div>
    ${err?`<div class="msg err">${esc(err)}</div>`:""}
    <div id="le" class="msg err" style="display:none"></div>
    <button class="btn block" id="lb">Sign in</button>
  </div>`;
  $("#lb").onclick=doLogin; $("#p").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin();});
}
async function doLogin(){
  const email=($("#e").value||"").trim().toLowerCase(), pass=$("#p").value||"";
  const le=$("#le"); le.style.display="none";
  if(!email||!pass){ le.textContent="Enter your email and password."; le.style.display="block"; return; }
  if(!ALLOWED.includes(email)){ le.textContent="That email is not a management login."; le.style.display="block"; return; }
  const b=$("#lb"); b.disabled=true; b.textContent="Signing in...";
  try{ await auth.signInWithEmailAndPassword(email,pass); }
  catch(e){ b.disabled=false; b.textContent="Sign in"; le.textContent = /password|credential|user/i.test(e.code||"")?"Email or password not recognised.":("Sign-in failed: "+(e.message||e)); le.style.display="block"; }
}

/* ---------- live overrides ---------- */
function startOverrides(){
  if(!fbReady) return;
  if(!ovUnsub) ovUnsub=db.collection("content_docs").onSnapshot(snap=>{
    const o={}; snap.forEach(d=>o[d.id]=d.data()||{}); overrides=o;
    if(!curKey && !curForm) renderList();
  }, err=>console.warn("overrides:",err&&err.message));
  if(!fovUnsub) fovUnsub=db.collection("content_forms").onSnapshot(snap=>{
    const o={}; snap.forEach(d=>o[d.id]=d.data()||{}); formOv=o;
    if(!curKey && !curForm) renderList();
  }, err=>console.warn("form overrides:",err&&err.message));
}

/* ---------- doc list ---------- */
function activeStore(){ return user.scope==='ALL' ? (pickStore||'Brighton') : user.scope; }
function docsForStore(st){
  return Object.values(DEFAULTS)
    .filter(d=> d.store===st || d.store==='both' )
    .sort((a,b)=> a.title.localeCompare(b.title));
}
function formStores(f){ return f.sites ? Object.keys(f.sites) : ['Brighton']; }
function formsForStore(st){
  const rows=[];
  Object.values(DEFAULT_FORMS).forEach(f=>{
    if(formStores(f).includes(st)) rows.push({type:f.key, store:st, title:f.title});
  });
  return rows.sort((a,b)=> a.title.localeCompare(b.title));
}
window._setStore=function(s){ pickStore=s; renderList(); };
function renderList(){
  curKey=null; W=null; curForm=null; WF=null;
  const st=activeStore();
  let h=`<h1 class="page">Editor</h1><p class="sub">Edit your order lists and daily forms. Saving updates the staff app within seconds.</p>`;

  // ----- Store selector -----
  if(user.scope==='ALL'){
    h+=`<div class="field" style="margin-bottom:20px"><label class="q">Which store are you editing?</label>
      <select id="storeSel" onchange="window._setStore(this.value)"
        style="width:100%;font-family:var(--body);font-size:16px;font-weight:600;color:var(--bark);background:#fff;border:1px solid var(--bark15);border-radius:12px;padding:13px 14px;outline:none">
        <option value="Brighton" ${st==='Brighton'?'selected':''}>Brighton</option>
        <option value="Worthing" ${st==='Worthing'?'selected':''}>Worthing</option>
      </select></div>`;
  } else {
    h+=`<div style="margin-bottom:18px"><span class="badge store" style="font-size:12px;padding:5px 12px">${esc(st)}</span></div>`;
  }

  // ----- Order lists -----
  h+=`<div class="eyebrow" style="margin-top:4px">${esc(st)} order lists</div>`;
  const docs=docsForStore(st);
  if(!docs.length) h+=`<p class="hint">No order lists for ${esc(st)} yet.</p>`;
  docs.forEach(d=>{
    const edited=!!overrides[d.key];
    h+=`<div class="card doc-row">
      <div class="meta"><div class="t">${esc((overrides[d.key]&&overrides[d.key].title)||d.title)}</div>
        <div class="d">${esc((overrides[d.key]&&overrides[d.key].sub)||d.sub||"")}</div>
        <div style="margin-top:7px"><span class="badge ${edited?'edited':'default'}">${edited?'Edited':'Original'}</span></div></div>
      <button class="btn gold sm" onclick="window._edit('${d.key}')">Edit</button>
    </div>`;
  });

  // ----- Daily forms -----
  h+=`<div class="eyebrow">${esc(st)} daily forms</div>`;
  h+=`<p class="hint" style="margin:-4px 0 12px">Edit the tick lists and section headings. The temperature, photo, name and signature parts are kept as they are so nothing breaks.</p>`;
  formsForStore(st).forEach(r=>{
    const edited=!!formOv[r.type];
    h+=`<div class="card doc-row">
      <div class="meta"><div class="t">${esc(r.title)}</div>
        <div style="margin-top:7px"><span class="badge ${edited?'edited':'default'}">${edited?'Edited':'Original'}</span></div></div>
      <button class="btn gold sm" onclick="window._editForm('${r.type}','${r.store}')">Edit</button>
    </div>`;
  });

  h+=`<p class="hint" style="margin-top:18px">Reference docs, the Staff Handbook and the screen layout are the next things I'll add here.</p>`;
  root().innerHTML=h; window.scrollTo(0,0);
}

/* ---------- editor ---------- */
function loadWorking(key){
  const src = overrides[key] ? overrides[key] : DEFAULTS[key];
  return { key, store:DEFAULTS[key].store, kind:DEFAULTS[key].kind||'doc',
    title:src.title||"", sub:src.sub||"",
    sections:(src.sections||[]).map(s=>({h:s.h||"",b:s.b||""})) };
}
window._edit=function(key){ curKey=key; W=loadWorking(key); renderEditor(); };

function syncFromDom(){
  if(!W) return;
  const t=$("#f_title"); if(t) W.title=t.value;
  const s=$("#f_sub"); if(s) W.sub=s.value;
  document.querySelectorAll("[data-sec]").forEach(card=>{
    const i=+card.getAttribute("data-sec");
    if(!W.sections[i]) return;
    W.sections[i].h=card.querySelector(".s_h").value;
    W.sections[i].b=card.querySelector(".s_b").value;
  });
}
function renderEditor(){
  const d=W;
  let h=`<button class="btn ghost dark sm" onclick="window._backList()">&larr; All lists</button>
    <h1 class="page" style="margin-top:12px">Edit list</h1>
    <p class="sub"><span class="badge store">${esc(d.store)}</span> ${overrides[d.key]?'<span class="badge edited">Edited</span>':'<span class="badge default">Original</span>'}</p>
    <div class="field"><label class="q">List name</label><input type="text" id="f_title" value="${esc(d.title)}"></div>
    <div class="field"><label class="q">Note under the name (optional)</label><input type="text" id="f_sub" value="${esc(d.sub)}"></div>
    <div class="eyebrow">Sections</div>
    <p class="hint" style="margin:-4px 0 12px">Each section is a heading and a list of items, one per line. Quantities can go on the line, e.g. "Feta 200g - 4". Suppliers are picked up from the wording, like "- Booker" or "- Amazon".</p>
    <div id="secs">`;
  d.sections.forEach((s,i)=>{ h+=secCard(s,i,d.sections.length); });
  h+=`</div>
    <button class="btn ghost dark block" style="margin-top:4px" onclick="window._addSec()">+ Add a section</button>
    <div id="edMsg"></div>
    <div class="bar">
      <button class="btn block" id="saveBtn" onclick="window._save()">Save &amp; publish to staff</button>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn ghost dark sm" style="flex:1" onclick="window._resetOriginal()">Reset to original</button>
        ${overrides[d.key]?`<button class="btn ghost dark sm" style="flex:1;color:var(--danger);border-color:#E7C7C1" onclick="window._revertLive()">Undo my live edits</button>`:``}
      </div>
    </div>`;
  root().innerHTML=h; window.scrollTo(0,0);
}
function secCard(s,i,n){
  return `<div class="sec-card" data-sec="${i}">
    <div class="field" style="margin-bottom:8px"><label class="q">Section heading</label><input type="text" class="s_h" value="${esc(s.h)}"></div>
    <div class="field" style="margin-bottom:0"><label class="q">Items (one per line)</label><textarea class="s_b" rows="6">${esc(s.b)}</textarea></div>
    <div class="sec-tools">
      <button onclick="window._moveSec(${i},-1)" ${i===0?'disabled':''}>&uarr; Up</button>
      <button onclick="window._moveSec(${i},1)" ${i===n-1?'disabled':''}>&darr; Down</button>
      <button class="del" onclick="window._delSec(${i})">Delete section</button>
    </div>
  </div>`;
}
window._backList=function(){ if(dirtyGuard()) renderList(); };
window._addSec=function(){ syncFromDom(); W.sections.push({h:"New section",b:""}); renderEditor(); };
window._delSec=function(i){ syncFromDom(); if(!confirm("Delete this whole section?")) return; W.sections.splice(i,1); renderEditor(); };
window._moveSec=function(i,dir){ syncFromDom(); const j=i+dir; if(j<0||j>=W.sections.length) return; const t=W.sections[i]; W.sections[i]=W.sections[j]; W.sections[j]=t; renderEditor(); };
window._resetOriginal=function(){ if(!confirm("Reset this list back to the original built-in version? Your unsaved changes here will be lost. (Nothing is published until you press Save.)")) return; W=loadFromDefault(curKey); renderEditor(); toast("Reset to original (not yet saved)"); };
function loadFromDefault(key){ const src=DEFAULTS[key]; return { key, store:src.store, kind:src.kind||'doc', title:src.title||"", sub:src.sub||"", sections:(src.sections||[]).map(s=>({h:s.h||"",b:s.b||""})) }; }
function dirtyGuard(){ return true; }

async function _saveCore(){
  syncFromDom();
  W.sections=W.sections.filter(s=> (s.h&&s.h.trim()) || (s.b&&s.b.trim()) );
  const payload={ key:W.key, title:(W.title||"").trim(), sub:(W.sub||"").trim(), store:W.store, kind:W.kind,
    sections:W.sections.map(s=>({h:(s.h||"").trim(), b:(s.b||"").replace(/\r\n/g,"\n").replace(/\s+$/,"")})),
    updatedAt: firebase.firestore.FieldValue.serverTimestamp(), updatedBy:user.email };
  await db.collection("content_docs").doc(W.key).set(payload);
}
window._save=async function(){
  const b=$("#saveBtn"); const m=$("#edMsg");
  if(!W.title.trim() && !($("#f_title")&&$("#f_title").value.trim())){ m.innerHTML=`<div class="msg err">Give the list a name first.</div>`; return; }
  b.disabled=true; b.textContent="Saving...";
  try{ await _saveCore(); toast("Published to staff"); m.innerHTML=`<div class="msg ok">Saved. The staff app now shows this version.</div>`; }
  catch(e){ m.innerHTML=`<div class="msg err">Couldn't save: ${esc(e.message||e)}</div>`; }
  b.disabled=false; b.textContent="Save & publish to staff";
};
window._revertLive=async function(){
  if(!confirm("Remove your saved edits and put the original built-in list back for staff? This cannot be undone.")) return;
  try{ await db.collection("content_docs").doc(curKey).delete(); toast("Reverted to original"); W=loadFromDefault(curKey); renderEditor(); }
  catch(e){ $("#edMsg").innerHTML=`<div class="msg err">Couldn't revert: ${esc(e.message||e)}</div>`; }
};

/* ==================== DAILY FORM EDITOR ==================== */
function loadFormFrom(src, type, store){
  const def=DEFAULT_FORMS[type];
  let fields;
  if(def.sites){ fields = (src.sites && src.sites[store]) ? src.sites[store] : def.sites[store]; }
  else { fields = src.fields || def.fields; }
  return { type, store, isSite:!!def.sites,
    title: src.title || def.title || "",
    intro: (src.intro!=null? src.intro : def.intro) || "",
    fields: JSON.parse(JSON.stringify(fields||[])) };
}
window._editForm=function(type,store){
  curForm={type,store}; curKey=null; W=null;
  const src = formOv[type] ? formOv[type] : DEFAULT_FORMS[type];
  WF=loadFormFrom(src,type,store); renderFormEditor();
};
function fieldKind(f){
  switch(f.type){
    case 'section':   return {tag:'Section heading', mode:'section', del:true};
    case 'checklist': return {tag:'Tick list',       mode:'checklist', del:true};
    case 'text':      return {tag:'Short answer',     mode:'label', del:false};
    case 'number':    return {tag:'Number answer',    mode:'label', del:false};
    case 'textarea':  return {tag:'Notes box',        mode:'label', del:false};
    case 'temps':     return {tag:'Temperatures',     mode:'locked', del:false};
    case 'file':      return {tag:'Photo upload',     mode:'locked', del:false};
    case 'signature': return {tag:'Signature',        mode:'locked', del:false};
    default:          return {tag:f.type||'field',    mode:'locked', del:false};
  }
}
function renderFormEditor(){
  const d=WF; const edited=!!formOv[d.type];
  let h=`<button class="btn ghost dark sm" onclick="window._backList()">&larr; All lists &amp; forms</button>
    <h1 class="page" style="margin-top:12px">Edit form</h1>
    <p class="sub"><span class="badge store">${esc(d.store)}</span> ${edited?'<span class="badge edited">Edited</span>':'<span class="badge default">Original</span>'}</p>
    <div class="field"><label class="q">Form name</label><input type="text" id="ff_title" value="${esc(d.title)}"></div>
    <div class="field"><label class="q">Intro note (shown at the top of the form)</label><textarea id="ff_intro" rows="2">${esc(d.intro)}</textarea></div>
    <div class="eyebrow">Form contents</div>
    <p class="hint" style="margin:-4px 0 12px">Edit the section headings and tick lists. Items go one per line. The greyed parts (temperatures, photo, name, signature) stay exactly as they are so submissions keep working.</p>
    <div id="ffields">`;
  d.fields.forEach((f,i)=>{ h+=fieldCard(f,i,d.fields.length); });
  h+=`</div>
    <div style="display:flex;gap:8px;margin-top:4px">
      <button class="btn ghost dark sm" style="flex:1" onclick="window._addFieldSection()">+ Section heading</button>
      <button class="btn ghost dark sm" style="flex:1" onclick="window._addFieldList()">+ Tick list</button>
    </div>
    <div id="fMsg"></div>
    <div class="bar">
      <button class="btn block" id="saveFBtn" onclick="window._saveForm()">Save &amp; publish to staff</button>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn ghost dark sm" style="flex:1" onclick="window._resetFormOriginal()">Reset to original</button>
        ${edited?`<button class="btn ghost dark sm" style="flex:1;color:var(--danger);border-color:#E7C7C1" onclick="window._revertFormLive()">Undo my live edits</button>`:``}
      </div>
    </div>`;
  root().innerHTML=h; window.scrollTo(0,0);
}
function fieldCard(f,i,n){
  const k=fieldKind(f);
  let body="";
  if(k.mode==='section'){
    body=`<div class="field" style="margin:0"><label class="q">Section heading</label><input type="text" class="ff_label" value="${esc(f.label||'')}"></div>`;
  } else if(k.mode==='checklist'){
    body=`<div class="field" style="margin-bottom:8px"><label class="q">Heading above the list (optional)</label><input type="text" class="ff_clabel" value="${esc(f.label||'')}"></div>
      <div class="field" style="margin:0"><label class="q">Items to tick (one per line)</label><textarea class="ff_items" rows="6">${esc((f.items||[]).join("\n"))}</textarea></div>`;
  } else if(k.mode==='label'){
    body=`<div class="field" style="margin:0"><label class="q">Question / label</label><input type="text" class="ff_label" value="${esc(f.label||'')}"></div>`;
  } else {
    body=`<p class="muted" style="margin:0">${esc(f.label||k.tag)} <span style="opacity:.7">(kept as-is)</span></p>`;
  }
  return `<div class="sec-card" data-fi="${i}" data-mode="${k.mode}">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <span class="badge ${k.del?'edited':'default'}" style="background:var(--blush);color:var(--bark70)">${esc(k.tag)}</span>
    </div>
    ${body}
    <div class="sec-tools">
      <button onclick="window._moveField(${i},-1)" ${i===0?'disabled':''}>&uarr; Up</button>
      <button onclick="window._moveField(${i},1)" ${i===n-1?'disabled':''}>&darr; Down</button>
      <button class="del" onclick="window._delField(${i})">Delete</button>
    </div>
  </div>`;
}
function syncFormDom(){
  if(!WF) return;
  const t=$("#ff_title"); if(t) WF.title=t.value;
  const n=$("#ff_intro"); if(n) WF.intro=n.value;
  document.querySelectorAll("[data-fi]").forEach(card=>{
    const i=+card.getAttribute("data-fi"); const f=WF.fields[i]; if(!f) return;
    const mode=card.getAttribute("data-mode");
    if(mode==='section'){ const el=card.querySelector(".ff_label"); if(el) f.label=el.value; }
    else if(mode==='checklist'){ const l=card.querySelector(".ff_clabel"); if(l){ const v=l.value.trim(); if(v) f.label=v; else delete f.label; }
      const it=card.querySelector(".ff_items"); if(it) f.items=it.value.replace(/\r\n/g,"\n").split("\n"); }
    else if(mode==='label'){ const el=card.querySelector(".ff_label"); if(el) f.label=el.value; }
  });
}
function genListKey(){ let k; do{ k='list_'+Math.random().toString(36).slice(2,7); }while(WF.fields.some(f=>f.key===k)); return k; }
window._addFieldSection=function(){ syncFormDom(); WF.fields.push({type:'section',label:'New section'}); renderFormEditor(); };
window._addFieldList=function(){ syncFormDom(); WF.fields.push({type:'checklist',key:genListKey(),items:['']}); renderFormEditor(); };
window._delField=function(i){
  syncFormDom(); const f=WF.fields[i]; if(!f) return; const k=fieldKind(f);
  const structural = (f.type==='section'||f.type==='checklist');
  const msg = structural
    ? "Delete this part of the form?"
    : "Delete the "+k.tag.toLowerCase()+" from this form?\n\nStaff will no longer see or fill in this part, and it will stop being recorded on new submissions. Past submissions keep what they already saved.";
  if(!confirm(msg)) return;
  WF.fields.splice(i,1); renderFormEditor();
};
window._moveField=function(i,dir){ syncFormDom(); const j=i+dir; if(j<0||j>=WF.fields.length) return; const t=WF.fields[i]; WF.fields[i]=WF.fields[j]; WF.fields[j]=t; renderFormEditor(); };
window._resetFormOriginal=function(){ if(!confirm("Reset this form back to the original built-in version? Unsaved changes here will be lost. (Nothing is published until you press Save.)")) return; WF=loadFormFrom(DEFAULT_FORMS[curForm.type],curForm.type,curForm.store); renderFormEditor(); toast("Reset to original (not yet saved)"); };
async function _saveFormCore(){
  syncFormDom();
  WF.fields = WF.fields.filter(f=>{
    if(f.type==='section') return (f.label||'').trim()!=='';
    if(f.type==='checklist') return (f.items||[]).some(x=>x&&x.trim());
    return true;
  }).map(f=>{ if(f.type==='checklist'){ f.items=(f.items||[]).map(x=>x.trim()).filter(Boolean); } return f; });
  const def=DEFAULT_FORMS[WF.type];
  const existing = formOv[WF.type] ? JSON.parse(JSON.stringify(formOv[WF.type])) : {};
  const payload = Object.assign({}, existing);
  payload.key=WF.type; payload.type=def.type||WF.type;
  payload.title=(WF.title||def.title||"").trim();
  payload.intro=(WF.intro!=null?WF.intro:(def.intro||""));
  if(def.sites){
    payload.sites = payload.sites || {};
    Object.keys(def.sites).forEach(st=>{
      if(st===WF.store) payload.sites[st]=WF.fields;
      else if(!payload.sites[st]) payload.sites[st] = (existing.sites&&existing.sites[st]) ? existing.sites[st] : def.sites[st];
    });
    delete payload.fields;
  } else {
    payload.fields=WF.fields; delete payload.sites;
  }
  payload.updatedAt=firebase.firestore.FieldValue.serverTimestamp();
  payload.updatedBy=user.email;
  await db.collection("content_forms").doc(WF.type).set(payload);
}
window._saveForm=async function(){
  const b=$("#saveFBtn"); const m=$("#fMsg");
  if(!(($("#ff_title")&&$("#ff_title").value.trim())||WF.title.trim())){ m.innerHTML=`<div class="msg err">Give the form a name first.</div>`; return; }
  b.disabled=true; b.textContent="Saving...";
  try{ await _saveFormCore(); toast("Published to staff"); m.innerHTML=`<div class="msg ok">Saved. The ${esc(WF.store)} version of this form now shows your changes.</div>`; }
  catch(e){ m.innerHTML=`<div class="msg err">Couldn't save: ${esc(e.message||e)}</div>`; }
  b.disabled=false; b.textContent="Save & publish to staff";
};
window._revertFormLive=async function(){
  if(!confirm("Remove your saved edits for this form (both stores) and put the original built-in version back for staff? This cannot be undone.")) return;
  try{ await db.collection("content_forms").doc(curForm.type).delete(); toast("Reverted to original"); WF=loadFormFrom(DEFAULT_FORMS[curForm.type],curForm.type,curForm.store); renderFormEditor(); }
  catch(e){ $("#fMsg").innerHTML=`<div class="msg err">Couldn't revert: ${esc(e.message||e)}</div>`; }
};
</script>
</body>
</html>
