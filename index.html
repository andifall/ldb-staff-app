<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#3D2B1F" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Laughing Dog - Staff & Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;600;700;800&family=Montserrat:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FAF8F3; --bark:#3D2B1F; --blush:#F0E8DF; --golden:#FFBE5C; --paw:#C8A882; --sage:#8A9E7A;
    --bark70:rgba(61,43,31,.70); --bark55:rgba(61,43,31,.55); --bark40:rgba(61,43,31,.40);
    --bark10:rgba(61,43,31,.10); --bark15:rgba(61,43,31,.15);
    --danger:#B4433A; --danger-bg:#F7E7E2; --amber:#8A5A12; --amber-bg:#FBEBD0; --sage-bg:#E9EEE3; --sage-tx:#4E6140;
    --shadow:0 3px 14px rgba(61,43,31,.07); --shadow-lg:0 8px 26px rgba(61,43,31,.10);
    --head:'League Spartan',-apple-system,BlinkMacSystemFont,sans-serif;
    --body:'Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:var(--body);color:var(--bark);background:var(--blush);line-height:1.5;font-size:16px}
  .app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--cream);
    display:flex;flex-direction:column;box-shadow:0 0 60px rgba(61,43,31,.08)}
  header.topbar{position:sticky;top:0;z-index:20;background:var(--bark);
    display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid rgba(0,0,0,.15)}
  .logo{display:flex;align-items:center;cursor:pointer}
  .logo-img{height:30px;width:auto;display:block}
  .sitepill{margin-left:auto;font-family:var(--head);font-size:12px;font-weight:600;color:var(--cream);text-transform:uppercase;letter-spacing:.08em;
    background:transparent;border:1px solid rgba(250,248,243,.35);padding:8px 14px;border-radius:999px;cursor:pointer}
  .sitepill:hover{background:rgba(250,248,243,.10)}
  .content{flex:1;padding:18px 16px 44px}
  h1.page{font-family:var(--head);font-weight:800;font-size:26px;color:var(--bark);margin:6px 0 4px;text-transform:uppercase;letter-spacing:.01em;line-height:1.05}
  .sub{color:var(--bark55);font-size:14px;margin:0 0 18px}
  .sec-title{font-family:var(--head);color:var(--bark);font-weight:700;text-transform:uppercase;letter-spacing:.09em;
    font-size:14px;margin:26px 0 12px}
  .sec-title:first-of-type{margin-top:8px}
  .eyebrow{font-family:var(--head);text-transform:uppercase;letter-spacing:.14em;font-size:12px;font-weight:600;color:var(--paw);margin:0 0 8px}
  .btn-list{display:flex;flex-direction:column;gap:12px}
  .pill{appearance:none;border:0;cursor:pointer;width:100%;display:block;text-decoration:none;
    background:var(--bark);color:var(--cream);font-family:var(--head);text-transform:uppercase;letter-spacing:.1em;
    font-size:14px;font-weight:600;padding:16px 18px;border-radius:999px;
    box-shadow:var(--shadow);text-align:center;transition:transform .06s ease,background .15s,filter .15s}
  .pill:active{transform:translateY(1px)}
  .pill:hover{filter:brightness(1.08)}
  .pill.cta{background:var(--golden);color:var(--bark)}
  .pill.ghost{background:transparent;color:var(--bark);border:1.5px solid var(--bark15);box-shadow:none}
  .pill.ghost:hover{background:var(--blush);filter:none}
  .pill.lock::after{content:"  🔒";font-size:12px;opacity:.7}
  .pill.small{padding:13px 16px;font-size:13px}
  .locked-note{font-size:13px;color:var(--bark55);text-align:center;margin:10px 0 0}
  .backbar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .back{background:none;border:0;color:var(--bark70);font-family:var(--head);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:12px;cursor:pointer;padding:6px 0}
  .back:hover{color:var(--bark)}
  /* home hubs */
  .hub-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .hub-tile{display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer;
    background:#fff;border:1px solid var(--bark10);border-radius:18px;padding:18px 16px;box-shadow:var(--shadow);transition:transform .08s ease,box-shadow .15s}
  .hub-tile:hover{box-shadow:var(--shadow-lg)} .hub-tile:active{transform:translateY(1px)}
  .hub-tile.wide{grid-column:1 / -1;flex-direction:row;align-items:center}
  .hub-ic{width:44px;height:44px;border-radius:12px;background:var(--blush);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .hub-ic svg{width:24px;height:24px;stroke:var(--bark);fill:none;stroke-width:1.7}
  .hub-tile.gold .hub-ic{background:var(--golden)}
  .hub-txt .hub-t{font-family:var(--head);font-weight:700;text-transform:uppercase;letter-spacing:.05em;font-size:14px;color:var(--bark)}
  .hub-txt .hub-d{font-size:12.5px;color:var(--bark55);margin-top:2px;line-height:1.35}
  /* list rows (sub pages) */
  .rowlist{display:flex;flex-direction:column;gap:10px}
  .rowitem{display:flex;align-items:center;gap:12px;text-decoration:none;cursor:pointer;
    background:#fff;border:1px solid var(--bark10);border-radius:14px;padding:15px 16px;box-shadow:var(--shadow);transition:background .15s}
  .rowitem:hover{background:var(--blush)}
  .rowitem .ri-t{flex:1;font-weight:600;color:var(--bark);font-size:15px}
  .rowitem .chev{color:var(--bark40);font-size:18px;flex:0 0 auto}
  /* forms */
  .field{margin:0 0 18px}
  .field label.q{display:block;font-weight:600;color:var(--bark);margin-bottom:7px;font-size:15px}
  .field .help{font-size:13px;color:var(--bark55);margin:-3px 0 8px}
  .req{color:var(--danger)}
  input[type=text],input[type=number],input[type=date],input[type=time],input[type=password],textarea,select{
    width:100%;font-size:16px;padding:13px 14px;border:1px solid var(--bark15);border-radius:12px;background:#fff;font-family:var(--body);color:var(--bark)}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--golden);box-shadow:0 0 0 3px rgba(255,190,92,.28)}
  textarea{min-height:90px;resize:vertical}
  input[type=checkbox],input[type=radio]{accent-color:var(--bark)}
  .row2{display:flex;gap:10px}
  .row2>div{flex:1}
  .note-box{background:var(--blush);border:1px solid var(--bark10);color:var(--bark70);padding:13px 15px;border-radius:14px;font-size:14px;margin:0 0 18px}
  .temps{display:flex;flex-direction:column;gap:10px}
  .temp-row{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--bark10);border-radius:12px;padding:9px 12px}
  .temp-row .name{flex:1;font-size:14px;font-weight:600;color:var(--bark)}
  .temp-row input{width:88px;text-align:center;padding:9px}
  .temp-hint{font-family:var(--head);font-size:11px;letter-spacing:.04em;min-width:74px;text-align:right;color:var(--bark40);text-transform:uppercase}
  .checklist{display:flex;flex-direction:column;gap:8px}
  .check{display:flex;gap:12px;align-items:flex-start;padding:12px 13px;border:1px solid var(--bark10);border-radius:12px;background:#fff}
  .check input{margin-top:2px;width:20px;height:20px;flex:0 0 auto}
  .check label{font-size:14px;color:var(--bark70)}
  .quiz .opt,.ack .opt{display:flex;gap:11px;align-items:flex-start;padding:12px 13px;border:1px solid var(--bark10);border-radius:12px;margin-bottom:8px;cursor:pointer;background:#fff}
  .quiz .opt:hover,.ack .opt:hover{background:var(--blush)}
  .quiz .opt input,.ack .opt input{margin-top:2px}
  .sigwrap{border:1.5px dashed var(--paw);border-radius:12px;background:#fff}
  canvas.sig{width:100%;height:160px;touch-action:none;display:block;border-radius:12px}
  .sig-actions{display:flex;justify-content:flex-end;padding:6px}
  .sig-actions button{background:none;border:0;color:var(--bark70);font-family:var(--head);text-transform:uppercase;letter-spacing:.06em;font-size:12px;font-weight:600;cursor:pointer}
  .submit{margin-top:8px}
  .err{color:var(--danger);font-size:13px;margin-top:6px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--bark);color:var(--cream);
    padding:12px 18px;border-radius:999px;font-size:14px;box-shadow:var(--shadow-lg);z-index:50;opacity:0;transition:opacity .2s}
  .toast.show{opacity:1}
  .center{min-height:74vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
  .center .big{font-family:var(--head);font-size:26px;color:var(--bark);font-weight:800;text-transform:uppercase;letter-spacing:.02em;margin:16px 0 6px}
  .choice{display:flex;gap:14px;width:100%;max-width:360px;margin-top:24px}
  .choice button{flex:1;padding:28px 10px;font-size:16px}
  .success svg{width:64px;height:64px}
  .picker-logo{background:var(--bark);padding:20px 28px;border-radius:20px;box-shadow:var(--shadow-lg)}
  /* allergens */
  .search{position:sticky;top:63px;background:var(--cream);padding:10px 0 12px;z-index:10}
  .cat-h{font-family:var(--head);font-weight:700;color:var(--bark);margin:16px 0 10px;font-size:16px;text-transform:uppercase;letter-spacing:.05em}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-family:var(--head);font-size:11px;font-weight:600;padding:5px 11px;border-radius:999px;text-transform:uppercase;letter-spacing:.05em}
  .chip.yes{background:var(--danger-bg);color:var(--danger)}
  .chip.trace{background:var(--amber-bg);color:var(--amber)}
  .chip.no{background:var(--sage-bg);color:var(--sage-tx)}
  .legend{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
  .cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .cat-tile{border:1px solid var(--bark10);background:#fff;border-radius:16px;padding:24px 10px;font-family:var(--head);font-weight:700;
    color:var(--bark);text-align:center;cursor:pointer;box-shadow:var(--shadow);font-size:14px;text-transform:uppercase;letter-spacing:.04em;transition:box-shadow .15s}
  .cat-tile:hover{box-shadow:var(--shadow-lg)}
  .amx-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--bark10);border-radius:14px;margin-top:6px;background:#fff}
  table.amx{border-collapse:collapse;width:max-content;min-width:100%;font-size:13px;background:#fff}
  table.amx th,table.amx td{border-bottom:1px solid var(--bark10)}
  th.dcol,td.dcol{position:sticky;left:0;background:#fff;text-align:left;padding:12px 12px;min-width:150px;max-width:190px;font-weight:600;color:var(--bark);z-index:2}
  thead th{background:var(--blush);position:sticky;top:0;z-index:3}
  thead th.dcol{z-index:4;background:var(--blush)}
  th.acol{width:28px;min-width:28px;height:104px;vertical-align:bottom;padding:6px 0}
  th.acol .vh{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;font-family:var(--head);font-size:11px;color:var(--bark55);font-weight:600;margin:0 auto;text-transform:uppercase;letter-spacing:.03em}
  td.ac{width:28px;min-width:28px;text-align:center;color:var(--danger);font-weight:800;border-left:1px solid var(--bark10)}
  td.ac.t{color:var(--amber);font-size:11px}
  tr.grp td.dcol{background:var(--blush);color:var(--bark);font-family:var(--head);font-weight:700;padding:9px 12px;text-transform:uppercase;letter-spacing:.05em;font-size:12px}
  tr.grp td{background:var(--blush)}
  tr.dish{cursor:pointer}
  tr.dish:hover td.dcol{background:var(--cream)}
  .dish-block{border:1px solid var(--bark10);border-radius:14px;padding:14px 16px;margin:0 0 10px}
  .dish-block.contains{border-color:#E7C7C1;background:var(--danger-bg)}
  .dish-block.traces{border-color:#F0DAB0;background:var(--amber-bg)}
  .dish-block.free{border-color:#CCD8C2;background:var(--sage-bg)}
  .dish-block .dbh{font-family:var(--head);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:9px;color:var(--bark)}
  .ing-txt{color:var(--bark70);font-size:14px;white-space:pre-line;background:#fff;border:1px solid var(--bark10);border-radius:14px;padding:14px 16px}
  .acc-item{border:1px solid var(--bark10);border-radius:14px;margin-bottom:10px;background:#fff;overflow:hidden;box-shadow:var(--shadow)}
  .acc-h{width:100%;text-align:left;background:none;border:0;cursor:pointer;padding:15px 16px;font-family:var(--head);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:14px;color:var(--bark);display:flex;justify-content:space-between;align-items:center;gap:10px}
  .acc-h .caret{color:var(--paw);transition:transform .15s;font-size:16px}
  .acc-item.open .acc-h .caret{transform:rotate(90deg)}
  .acc-b{display:none;padding:2px 16px 16px;white-space:pre-line;color:var(--bark70);font-size:14px;line-height:1.55}
  .acc-item.open .acc-b{display:block}
  /* management */
  .mgmt-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px}
  .mgmt-tabs button{white-space:nowrap;border:1px solid var(--bark15);background:#fff;color:var(--bark70);font-family:var(--head);
    padding:9px 15px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;text-transform:uppercase;letter-spacing:.05em}
  .mgmt-tabs button.active{background:var(--bark);color:var(--cream);border-color:var(--bark)}
  .alert-banner{background:var(--danger-bg);border:1px solid #E7C7C1;color:var(--danger);border-radius:14px;padding:13px 15px;margin-bottom:14px;font-weight:700;font-size:14px}
  .alert-banner .ab-row{font-weight:500;font-size:13px;margin-top:6px;padding-top:6px;border-top:1px solid #EBD3CD;cursor:pointer}
  .sub-card.alert{border-left:4px solid var(--danger)}
  .sub-card{border:1px solid var(--bark10);border-radius:14px;padding:13px 15px;margin-bottom:10px;background:#fff;cursor:pointer;box-shadow:var(--shadow)}
  .rec-sum{color:var(--bark70);font-size:13px;margin-top:5px}
  .sub-card .top{display:flex;justify-content:space-between;gap:8px}
  .sub-card .who{font-weight:700;color:var(--bark)}
  .sub-card .when{font-size:12px;color:var(--bark55)}
  .sub-card .type{font-size:12px;color:var(--paw);font-weight:700;margin-top:2px}
  .kv{margin:5px 0;font-size:14px;color:var(--bark70)}
  .kv b{color:var(--bark)}
  .muted{color:var(--bark55)}
  .spinner{width:26px;height:26px;border:3px solid var(--blush);border-top-color:var(--golden);border-radius:50%;animation:spin .8s linear infinite;margin:24px auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .bad-badge{display:inline-block;background:var(--danger-bg);color:var(--danger);font-family:var(--head);font-size:10px;font-weight:600;padding:3px 9px;border-radius:999px;margin-left:6px;text-transform:uppercase;letter-spacing:.05em}
  footer.made{padding:24px;text-align:center;color:var(--bark40);font-family:var(--head);text-transform:uppercase;letter-spacing:.1em;font-size:10px}
</style>
</head>

function header(){
  const site = store.site || "";
  return `<header class="topbar">
    <div class="logo" onclick="location.hash='#/'"><img class="logo-img" src="${LOGO}" alt="Laughing Dog"></div>
    <button class="sitepill" onclick="location.hash='#/settings'">${esc(site||"Choose site")} ▾</button>
  </header>`;
}
function shell(inner){ app.innerHTML = header() + `<div class="content">${inner}</div>` + `<footer class="made">Laughing Dog</footer>`; }
function backbar(label,to){ return `<div class="backbar"><button class="back" onclick="window._nav('${to}')">‹ ${esc(label)}</button></div>`; }
// Navigate to a hash. If we're already on that hash (e.g. a record detail was
// rendered on top without changing the URL), force a re-render so Back still works.
window._nav=function(to){ if(location.hash===to){ router(); } else { location.hash=to; } };

/* Resolve a form's fields for the current store (forms can be site-specific). */
function resolveFields(def){
  if(def.sites){ return def.sites[store.site] || def.sites.Brighton || Object.values(def.sites)[0] || []; }
  return def.fields || [];
}
function allFieldDefs(def){
  if(def.sites){ let a=[]; Object.values(def.sites).forEach(f=>{ a=a.concat(f); }); return a; }
  return def.fields || [];
}

/* =========================================================
   FORM ENGINE
   ========================================================= */
function renderField(f){
  const req = f.required ? ' <span class="req">*</span>' : '';
  const help = f.help ? `<div class="help">${esc(f.help)}</div>` : '';
  switch(f.type){
    case "section":
      return `<div class="sec-title" style="font-size:17px;margin:22px 0 6px">${esc(f.label)}</div>${help}`;
    case "note":
      return `<div class="note-box">${esc(f.label)}</div>`;
    case "text": case "number": case "date": case "time":
      return `<div class="field"><label class="q">${esc(f.label)}${req}</label>${help}
        <input type="${f.type}" data-key="${f.key}" ${f.type==='number'?'step="0.1" inputmode="decimal"':''}></div>`;
    case "textarea":
      return `<div class="field"><label class="q">${esc(f.label)}${req}</label>${help}
        <textarea data-key="${f.key}"></textarea></div>`;
    case "name":
      return `<div class="field"><label class="q">${esc(f.label)}${req}</label>${help}
        <div class="row2"><div><input type="text" data-key="${f.key}_first" placeholder="First name"></div>

/* signature pad */
function initSigs(){
  document.querySelectorAll("canvas.sig").forEach(cv=>{
    const ratio = window.devicePixelRatio||1;
    const rect = cv.getBoundingClientRect();
    cv.width = rect.width*ratio; cv.height=160*ratio;
    const ctx=cv.getContext("2d"); ctx.scale(ratio,ratio); ctx.lineWidth=2.2; ctx.lineCap="round"; ctx.strokeStyle="#1b2a5c";
    let drawing=false,last=null; cv._empty=true;
    const pos=e=>{const r=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};};
    const start=e=>{drawing=true;last=pos(e);e.preventDefault();};
    const move=e=>{if(!drawing)return;const p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;cv._empty=false;e.preventDefault();};
    const end=()=>{drawing=false;};
    cv.addEventListener("mousedown",start);cv.addEventListener("mousemove",move);window.addEventListener("mouseup",end);
    cv.addEventListener("touchstart",start,{passive:false});cv.addEventListener("touchmove",move,{passive:false});cv.addEventListener("touchend",end);
  });
}
window._clearSig=function(btn){const cv=btn.closest(".sigwrap").querySelector("canvas");const ctx=cv.getContext("2d");ctx.clearRect(0,0,cv.width,cv.height);cv._empty=true;};

function collect(def){
  const data={}; const errs=[];
  for(const f of resolveFields(def)){
    if(f.type==="section"||f.type==="note") continue;
    const label=f.label||f.key;
    if(f.type==="text"||f.type==="textarea"||f.type==="number"||f.type==="date"||f.type==="time"){
      const el=document.querySelector(`[data-key="${f.key}"]`); const v=el?el.value.trim():"";
      if(f.required&&!v) errs.push(label);
      if(v!=="") data[f.key]= f.type==="number"? Number(v): v;
    } else if(f.type==="name"){
      const fn=document.querySelector(`[data-key="${f.key}_first"]`).value.trim();
      const ln=document.querySelector(`[data-key="${f.key}_last"]`).value.trim();
      const full=(fn+" "+ln).trim();
      if(f.required&&!full) errs.push(label);
      if(full) data[f.key]=full;
    } else if(f.type==="select"){
      const v=document.querySelector(`[data-key="${f.key}"]`).value;
      if(f.required&&!v) errs.push(label); if(v) data[f.key]=v;
    } else if(f.type==="radio"||f.type==="yesno"){
      const el=document.querySelector(`input[name="${f.key}"]:checked`); const v=el?el.value:"";
      if(f.required&&!v) errs.push(label); if(v) data[f.key]=v;
    } else if(f.type==="checklist"){
      const checked=[...document.querySelectorAll(`[data-checklist="${f.key}"] input:checked`)].map(i=>i.value);
      data[f.key]=checked;
    } else if(f.type==="acknowledge"){
      const boxes=[...document.querySelectorAll(`[data-ack="${f.key}"] input`)];
      const checked=boxes.filter(b=>b.checked);
      if(f.required && checked.length<boxes.length) errs.push(label+" (tick all to confirm)");
      data[f.key]=checked.length+"/"+boxes.length+" confirmed";
    } else if(f.type==="quiz"){
      const el=document.querySelector(`input[name="${f.key}"]:checked`);
      if(f.required&&!el){ errs.push(label); }
      else if(el){ const idx=Number(el.value); data[f.key]={answer:f.options[idx],correct:idx===f.answer}; }
    } else if(f.type==="temps"){
      const rows=[...document.querySelectorAll(`[data-temp="${f.key}"]`)]; const t={};
      rows.forEach(r=>{const inp=r.querySelector("input");if(inp.value!=="")t[r.dataset.name]={c:Number(inp.value),max:Number(r.dataset.max),ok:Number(inp.value)<=Number(r.dataset.max)};});
      data[f.key]=t;
    } else if(f.type==="file"){
      // Photos are read and compressed asynchronously in processPhotos() at submit time.
    } else if(f.type==="signature"){
      const cv=document.querySelector(`[data-sig="${f.key}"]`);
      if(cv&&!cv._empty){ data[f.key]=cv.toDataURL("image/png"); }
      else if(f.required){ errs.push(label); }
    }
  }
  return {data,errs};
}

// Shrink a photo to a compact JPEG data URL so it can be saved inside the record.
function resizeImage(file, maxDim, quality){
  return new Promise((resolve,reject)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{
      let w=img.width, h=img.height;
      if(w>=h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
      else if(h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      try{ resolve(cv.toDataURL("image/jpeg",quality)); }catch(e){ reject(e); }
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error("image load failed")); };
    img.src=url;
  });
}
// Read each photo field's files, compress them, store as an array of data URLs (max 4).
async function processPhotos(def, data){
  for(const f of resolveFields(def)){
    if(f.type!=="file") continue;
    const el=document.querySelector(`[data-key="${f.key}"]`);
    if(!el||!el.files||!el.files.length) continue;
    const urls=[];
    for(const file of Array.from(el.files).slice(0,4)){
      if(!file.type.startsWith("image/")) continue;
      try{ urls.push(await resizeImage(file, 1000, 0.6)); }catch(e){}
    }
    if(urls.length) data[f.key]=urls;
  }
}
async function submitForm(def){
  const {data,errs}=collect(def);
  const errBox=$("#formerr");
  if(errs.length){ errBox.textContent="Please complete: "+errs.join(", "); window.scrollTo({top:0,behavior:'smooth'}); return; }
  errBox.textContent="";
  const btn=$("#submitBtn"); btn.disabled=true; btn.textContent="Submitting…";
  if(!fbReady){ btn.disabled=false; btn.textContent="Submit"; errBox.textContent="Can't save yet - no connection to the database. Submitting works once the app is online / deployed."; return; }
  try{ await processPhotos(def, data); }catch(e){}
  let alertUnits=[];
  if(data.temps){ for(const n in data.temps){ const t=data.temps[n]; if(t && t.ok===false) alertUnits.push(n+" - "+t.c+"°C"); } }
  const payload={
    formType:def.type, formTitle:def.title, store:store.site,
    submittedBy:data.name||"", data:data, createdAt:firebase.firestore.FieldValue.serverTimestamp(),
    createdAtLocal:new Date().toISOString(),
    alert: alertUnits.length>0, alertUnits: alertUnits,
  };
  try{
    await db.collection("staff_submissions").add(payload);
    viewSuccess(def);
  }catch(err){
    console.error(err);
    btn.disabled=false; btn.textContent="Submit";
    if((err.code||"").includes("permission")){
      errBox.innerHTML="Saved locally for now - the Firestore security rules haven't been switched on yet. Once Simon deploys the rules file (2 minutes, in the setup guide) submissions will save live.";
    } else {
      errBox.textContent="Couldn't submit: "+(err.message||err);
    }
  }
}

function markCell(v){ const s=alState(v); if(s==="c")return `<td class="ac c">✓</td>`; if(s==="t")return `<td class="ac t">t</td>`; return `<td class="ac"></td>`; }
function matrixHtml(groups){
  const head=`<tr><th class="dcol">Dish</th>${ALLERGEN_COLS.map(([k,l])=>`<th class="acol"><div class="vh">${esc(l)}</div></th>`).join("")}</tr>`;
  let rows="";
  groups.forEach(g=>{
    if(g.name) rows+=`<tr class="grp"><td class="dcol">${esc(g.name)}</td>${ALLERGEN_COLS.map(()=>"<td></td>").join("")}</tr>`;
    g.items.forEach(it=>{
      rows+=`<tr class="dish" onclick="location.hash='#/allergens/dish/${it.id}'"><td class="dcol">${esc(it.name||"")}</td>${ALLERGEN_COLS.map(([k])=>markCell(it.allergens?it.allergens[k]:null)).join("")}</tr>`;
    });
  });
  return `<div class="amx-wrap"><table class="amx"><thead>${head}</thead><tbody>${rows}</tbody></table></div>`;
}

function renderAllergenBody(){
  const body=$("#allergenBody"); if(!body) return;
  if(_cats===null||_items===null) return; // still loading
  if(!_cats.length && !_items.length){ body.innerHTML=`<p class="muted">No allergen entries for ${esc(store.site)} yet.</p>`; return; }
  if(_alSearch.trim()){
    const hits=_items.filter(alMatch);
    body.innerHTML = hits.length ? matrixHtml([{name:null,items:hits}]) : `<p class="muted">No dishes match “${esc(_alSearch)}”.</p>`;
    return;
  }
  if(_alCat){
    const cat=_cats.find(c=>c.id===_alCat);
    const subs=_cats.filter(c=>c.parentId===_alCat).sort((a,b)=>(a.order||0)-(b.order||0));
    const groups=[];
    const direct=alItemsOf(_alCat); if(direct.length) groups.push({name:null,items:direct});
    subs.forEach(sc=>{ const its=alItemsOf(sc.id); if(its.length) groups.push({name:sc.name,items:its}); });
    body.innerHTML = `<div class="cat-h">${esc(cat?cat.name:"")}</div>` + (groups.length? matrixHtml(groups) : `<p class="muted">No dishes in this category yet.</p>`);
    return;
  }
  const top=_cats.filter(c=>!c.parentId);
  const hasItems=cat=>{ if(alItemsOf(cat.id).length)return true; return _cats.some(sc=>sc.parentId===cat.id && alItemsOf(sc.id).length); };
  const tiles=top.filter(hasItems);
  body.innerHTML = `<div class="cat-grid">${tiles.map(c=>`<button class="cat-tile" onclick="location.hash='#/allergens/${c.id}'">${esc(c.name)}</button>`).join("")}</div>`
    + `<p class="muted" style="margin-top:14px;font-size:13px">Tap a category, then tap a dish for its full ingredients.</p>`;
}

function viewAllergensDish(id){
  _alDish=id;
  const backTo = _alCat ? "#/allergens/"+_alCat : "#/allergens";
  if(!fbReady){ shell(backbar("Back",backTo)+`<p class="err">Needs an internet connection.</p>`); return; }
  ensureAllergenData();
  if(_items===null){ shell(backbar("Back",backTo)+`<div class="spinner"></div>`); return; }
  const it=_items.find(x=>x.id===id);
  if(!it){ shell(backbar("Allergens","#/allergens")+`<p class="muted">Dish not found.</p>`); return; }
  const contains=ALLERGEN_COLS.filter(([k])=>alState(it.allergens?it.allergens[k]:null)==="c").map(([k,l])=>l);
  const traces=ALLERGEN_COLS.filter(([k])=>alState(it.allergens?it.allergens[k]:null)==="t").map(([k,l])=>l);
  let h=backbar("Back",backTo);
  h+=`<h1 class="page">${esc(it.name||"")}</h1><p class="sub">${esc(it.store==="both"?"Brighton & Worthing":it.store||store.site)}</p>`;
  h+=`<div class="dish-block contains"><div class="dbh">Contains</div>${contains.length?`<div class="chips">${contains.map(l=>`<span class="chip yes">${esc(l)}</span>`).join("")}</div>`:`<p class="muted">Nothing listed</p>`}</div>`;
  if(traces.length) h+=`<div class="dish-block traces"><div class="dbh">May contain traces</div><div class="chips">${traces.map(l=>`<span class="chip trace">${esc(l)}</span>`).join("")}</div></div>`;
  if(it.ingredients) h+=`<div class="sec-title" style="font-size:16px">Ingredients</div><div class="ing-txt">${esc(it.ingredients)}</div>`;
  h+=`<p class="muted" style="font-size:12px;margin-top:14px">We use all 14 allergens in our kitchen, so cross-contamination is always possible. This shows what a dish contains or may contain traces of. If anything is unclear, check with the kitchen.</p>`;
  shell(h);
}

async function doLogin(){

let _subs=null, _subsUnsub=null, _mgmtFilter="all";
function viewManage(){

window._setMgmtFilter=function(k){ _mgmtFilter=k; document.querySelectorAll(".mgmt-tabs button").forEach(b=>b.classList.toggle("active",b.dataset.f===k)); renderSubs(); };
function subscribeSubs(){
  if(_subsUnsub){ try{_subsUnsub()}catch(e){} }
  _subs=null;
  if(!fbReady){ const b=$("#subsBody"); if(b) b.innerHTML=`<p class="err">No database connection right now.</p>`; return; }
  let ref=db.collection("staff_submissions");
  if(manager.scope!=="ALL") ref=ref.where("store","==",manager.scope);
  _subsUnsub=ref.onSnapshot(snap=>{
    _subs=snap.docs.map(d=>({id:d.id,...d.data()}));
    _subs.sort((a,b)=>{const ta=a.createdAt&&a.createdAt.seconds?a.createdAt.seconds:(Date.parse(a.createdAtLocal||0)/1000||0);const tb=b.createdAt&&b.createdAt.seconds?b.createdAt.seconds:(Date.parse(b.createdAtLocal||0)/1000||0);return tb-ta;});
    renderSubs();
  },err=>{ const b=$("#subsBody"); if(b) b.innerHTML=`<p class="err">Couldn't load submissions: ${esc(err.message)}<br><span class="muted">If this says permission denied, deploy the Firestore rules from the setup guide.</span></p>`; });
}
function fmtWhen(s){ let d=null; if(s.createdAt&&s.createdAt.seconds)d=new Date(s.createdAt.seconds*1000); else if(s.createdAtLocal)d=new Date(s.createdAtLocal); if(!d||isNaN(d))return ""; return d.toLocaleString("en-GB",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}); }
function subHasAlert(s){ if(s.alert) return true; if(s.data&&s.data.temps){ return Object.values(s.data.temps).some(t=>t&&t.ok===false); } return false; }
function renderSubs(){
  const body=$("#subsBody"); if(!body)return;
  if(_subs===null)return;
  let list=_subs; if(_mgmtFilter!=="all") list=list.filter(s=>s.formType===_mgmtFilter);
  // recent temperature alerts across everything in scope
  const alerts=_subs.filter(subHasAlert).slice(0,20);
  let banner="";
  if(alerts.length){
    banner=`<div class="alert-banner">⚠️ ${alerts.length} temperature alert${alerts.length>1?"s":""} need checking`
      + alerts.slice(0,5).map(s=>`<div class="ab-row" onclick="window._openSub('${s.id}')">${esc(s.store||"")} · ${esc(s.submittedBy||"-")} · ${esc(fmtWhen(s))}${(s.alertUnits&&s.alertUnits.length)?` - ${esc(s.alertUnits.join(", "))}`:""}</div>`).join("")
      + (alerts.length>5?`<div class="ab-row muted">…and ${alerts.length-5} more</div>`:"")
      + `</div>`;
  }
  if(!list.length){ body.innerHTML=banner+`<p class="muted">No submissions yet${_mgmtFilter!=="all"?" for this type":""}.</p>`; return; }
  body.innerHTML=banner+list.slice(0,200).map((s,i)=>{
    const alert=subHasAlert(s);
    const flag=alert?`<span class="bad-badge">temp alert</span>`:"";
    return `<div class="sub-card${alert?' alert':''}" onclick="window._openSub('${s.id}')">
      <div class="top"><span class="who">${esc(s.submittedBy||"-")}${flag}</span><span class="when">${esc(fmtWhen(s))}</span></div>
      <div class="type">${esc((FORMS[s.formType]&&FORMS[s.formType].title)||s.formTitle||s.formType)} · ${esc(s.store||"")}</div>
    </div>`;
  }).join("");
}
window._openSub=function(id){ const s=_subs.find(x=>x.id===id); if(!s)return; renderSubDetail(s); };
function renderSubDetail(s, back){
  let h=backbar("Back", back||"#/manage");
  h+=`<h1 class="page">${esc((FORMS[s.formType]&&FORMS[s.formType].title)||s.formTitle||s.formType)}</h1>`;
  h+=`<p class="sub">${esc(s.store||"")} · ${esc(fmtWhen(s))} · ${s.submittedBy?("by "+esc(s.submittedBy)):"no name recorded"}</p>`;
  const d=s.data||{};
  const rows=[];
  for(const [k,v] of Object.entries(d)){
    if(v==null||v==="")continue;
    let val="";
    if(k==="temps"&&typeof v==="object"){ val="<br>"+Object.entries(v).map(([n,t])=>`&nbsp;&nbsp;${esc(n)}: <b style="color:${t.ok?'#166534':'#b91c1c'}">${esc(t.c)}°C</b>${t.ok?"":" ⚠️"}`).join("<br>"); }
    else if(Array.isArray(v)){
      if(v.length && v.every(x=>typeof x==="string" && x.startsWith("data:image"))){
        val = "<br>"+v.map(x=>`<img src="${x}" style="max-width:240px;border:1px solid var(--bark10);border-radius:10px;margin:6px 6px 0 0">`).join("");
      } else {
        val = v.length? "<br>"+v.map(x=>"&nbsp;&nbsp;• "+esc(x)).join("<br>") : "<span class='muted'>none ticked</span>";
      }
    }
    else if(typeof v==="object"&&v.answer!==undefined){ val=esc(v.answer)+(v.correct===false?" <span class='bad-badge'>wrong</span>":""); }
    else if(typeof v==="object"&&v.filename){ val=esc(v.filename)+" <span class='muted'>(photo)</span>"; }
    else if(typeof v==="string"&&v.startsWith("data:image")){ val=`<br><img src="${v}" style="max-width:220px;border:1px solid #ddd;border-radius:8px">`; }
    else if(typeof v==="object"){ val=esc(JSON.stringify(v)); }
    else val=esc(v);
    const label = prettyKey(k, s.formType);
    rows.push(`<div class="kv"><b>${esc(label)}:</b> ${val}</div>`);
  }
  h+=`<div class="sub-card" style="cursor:default">${rows.join("")||"<span class='muted'>No data</span>"}</div>`;
  shell(h);
}
function prettyKey(k,formType){
  const def=FORMS[formType]; if(def){const f=allFieldDefs(def).find(x=>x.key===k); if(f&&f.label)return f.label;}
  return k.replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase());
}

function recSummary(s){
  const d=s.data||{};
  if(s.formType==="deep_cleans"&&d.deep_cleaned) return "Cleaned: "+d.deep_cleaned;
  if(s.formType==="four_weekly") return d.observed_problem_or_repeat==="Yes"?"Issue noted in review":"Reviewed, no issues";
  if(s.formType==="fat_trap") return d.completed||d.notes||"";
  if(d.temps&&typeof d.temps==="object"){
    const bad=Object.entries(d.temps).filter(([n,t])=>t&&t.ok===false).map(([n,t])=>`${n} ${t.c}°C`);
    if(bad.length) return "Out of range: "+bad.join(", ");
    if(Object.keys(d.temps).length) return "All temps in range";
  }
  return d.notes||"";
}
function whoLabel(s){ return s.submittedBy?esc(s.submittedBy):`<span class="muted">No name recorded</span>`; }

}

    {h:"Chia Seed Jam", b:"1/2 cup caster sugar\n1/2 cup maple syrup\n2 tbsp vanilla extract\n1 1/2 cups water\n1kg frozen summer fruit\n180g chia seeds\n\nPut the sugar, maple syrup, water, vanilla extract and fruit in a saucepan and cook for 25-30 minutes on medium heat. The fruit should get soft. Turn the heat off and stir in the chia seeds. Stir."},
    {h:"Mushrooms (1 tray makes 1 box)", b:"1 full box of baby button mushrooms\n5 tbsp chopped parsley\n1/2 tbsp dried thyme\n5 cloves garlic, finely chopped\n2 tbsp balsamic vinegar\n\nUse one big oven pan per box of mushrooms.\nDrizzle with olive oil, a good amount of salt and pepper.\nRoast at 170C for 15 mins until they start to darken.\nAdd garlic, parsley, thyme and balsamic vinegar and roast for a further 10 mins."},
    {h:"Buddha Bowl - Dry Ingredients", b:"QUINOA MIX\n(x the recipe by at least 3 for weekdays, maybe x4 for weekends)\n1 cup quinoa\n2 cups cold water\n1 tsp quinoa spice mix\n1/4 tsp salt\nCombine the quinoa, spices, salt and water in a medium pot. Cover and bring to a boil; once boiling, reduce the heat and simmer for 12 minutes with the lid on. Remove from the heat and let it sit, lid on, for 10 more minutes.\n\nPICKLED RED ONION\n2kg red onions\n6 cups white vinegar\n3 cups water\n1.5 cup caster sugar\n9 tbsp sea salt\n2 tsp peppercorns\n8 cloves garlic\nCut the red onions into quarters and slice in the food processor. Heat the vinegar, water, sugar and salt in a saucepan over medium heat. Stir until the sugar and salt dissolve, about 1 minute. Let cool and pour over the onions. Add a teabag with the peppercorns and garlic. Set aside to cool to room temperature, then store in the fridge. Ready once bright pink and tender (about 1 hour for thinly sliced, or overnight for thicker). Keeps in the fridge up to 2 weeks.\n\nTOFU\n1 pack extra firm or firm tofu\n1/4 cup soy sauce\n1 tbsp rice vinegar\n1 tsp maple syrup\n1 garlic clove, finely grated\n1/2 tsp fresh ginger, finely grated\n1 tsp gochugaru\n2 tbsp toasted sesame oil\n1 tbsp minced spring onion\nRemove the tofu and drain. Microwave on high for 3 minutes to help extract liquid. Drain the excess, place on a paper towel with another folded towel on top, a cutting board and a heavy object. Press for 30 minutes. Cut each rectangle into 12 cubes. Make the marinade by blending all the other ingredients. Place everything in a box and swirl gently to coat. Refrigerate at least 30 minutes, swirling again gently halfway. Stores refrigerated for 5 days.\n\nTOASTED PUMPKIN SEEDS\n1kg pumpkin seeds\n2 tbsp olive oil\n2 tsp salt\nRoast at 150C for 25 min. Let cool completely before storing."},
    {h:"Buddha Bowl - Dressings", b:"BEETROOT MAPLE TAHINI (1 bottle)\n4 tsp beetroot powder\n2/3 cup tahini\n2 tbsp maple syrup\n4 tbsp lemon juice\nhot water to thin to a smooth, silky consistency\nWhisk all together and pour into a serving bottle (keeps 5 days).\n\nLIME & CORIANDER\n4 cups fresh coriander\n2 garlic cloves\n1/2 cup fresh lime juice\n4 tsp maple syrup\n1 tsp ground coriander\n1 tsp sea salt\n1 cup extra-virgin olive oil\nBlend all together and pour into a bottle (keeps 5 days).\n\nGINGER MISO\n6 tbsp extra-virgin olive oil\n4 garlic cloves, minced\n4 tsp freshly grated ginger\n1 cup fresh clementine juice (or orange)\n2 tbsp white miso paste\nBlend all together and pour into a bottle (keeps 5 days).\n\nSWEET MUSTARD\n1/4 cup Dijon mustard\n1/2 cup extra-virgin olive oil\n3 tbsp apple cider vinegar\n2 tbsp maple syrup\n7 small garlic cloves, grated or minced\n2 tbsp cold water\nBlend all together and pour into a bottle (keeps 5 days)."},
    {h:"Mint Peas", b:"2kg petit pois\n100g mint\n150g pesto\n100g lemon juice\n8 spring onions\n2 tsp salt\npepper\n\nDefrost the peas in lukewarm (not hot) water then drain. Wash and pick the mint leaves. Wash and roughly chop the spring onions. Add everything together in a bowl and briefly mix. In batches, blend the pea mix to a coarse consistency (do not make mushy peas)."},
    {h:"Specials", b:"MEDITERRANEAN VEGETABLES FOR BAP (Summer 2026) - makes about 10 portions\n2 medium aubergines, cut into half moons\n2 large courgettes, cut into half moons\n2 red peppers, thick slices\n2 yellow peppers, thick slices\n2 medium white onions, thick slices\n10 cloves garlic, whole\nsalt, pepper, oregano, olive oil\nToss the cut aubergine with some salt and let rest 20-30 min. Discard the water and rinse. Squeeze out as much water as possible, then toss in a big tray with the other veg. Add salt, pepper, olive oil and oregano. Bake at 170C for 1h. Keeps for 5 days.\n\nSTEWED APPLE & MAPLE BUTTER PANCAKES (Autumn/Winter 2025)\nApples (roughly 12 portions)\n12 peeled and sliced green apples\n16 tbsp granulated sugar\n4 tbsp lemon juice\n3 tsp cinnamon\n4 tbsp water\nMix the lemon juice, sugar, cinnamon and water in a jug. Place the apple slices in the pan in an even layer (don't add a second layer or it affects cooking; do it in stages). Pour the sugar mixture over and cover. Heat on low for around 5 minutes; once the apples look slightly softer, increase to medium-high for another 5 minutes, or until the sugar mixture is thick and the apples cooked through. (Watch closely on high heat, the sugar can burn quickly.)\n\nMaple Butter\n8 tbsp unsalted vegan butter (Flora blocks)\n1/2 cup dark or robust maple syrup\n1/2 tsp salt\n1/2 tsp ground cinnamon\nLet the butter soften at room temperature. Place 1/2 cup maple syrup in a saucepan over medium heat and bring to a simmer; reduce to medium-low and simmer until reduced by a quarter, 10-12 minutes (watch it doesn't boil over). Remove from the heat and let cool (not too long, it hardens). Beat the butter until smooth and creamy, about 1 minute. Add the cooled maple syrup, salt and cinnamon. Beat until fluffy and lighter in colour, 1-2 minutes."},
  ]},

  holidays:{ title:"Holidays", sub:"How to request holiday, and the policy", sections:[
    {h:"Before You Request", b:"Holiday is requested through BrightPay and your shifts are managed in Square. Holiday must always be requested and approved in advance.\n\nBefore you submit a request, check:\n- You have enough holiday hours available in BrightPay\n- Your requested time off does not exceed your normal working hours\n- The dates do not clash with key business needs or peak periods"},
    {h:"Step 1: Check your balance in BrightPay", b:"1. Open the BrightPay Employee app\n2. Log in using your registered email address\n3. Go to Holiday / Time Off\n4. Check your available holiday balance and any holiday already booked\n\nIf you are unsure about your balance, speak to a manager before requesting time off."},
    {h:"Step 2: Request holiday in BrightPay", b:"1. In the BrightPay Employee app, go to Holiday / Time Off\n2. Select Request Holiday\n3. Enter your start date and end date, and the number of hours requested (not days)\n4. Add any notes if required\n5. Submit your request\n\nYou will get a notification once your request is approved or declined. Your request may be edited if the hours requested go over your normal contracted hours.\n\nImportant: holiday pay is not confirmed until it has been approved in BrightPay."},
    {h:"Step 3: Check your shifts in Square", b:"1. Open the Square Team app\n2. Check your upcoming shifts on the rota\n3. Do not assume shifts will be removed automatically\n\nOnce your holiday is approved, management will update the rota in Square. You should double-check that your shifts have been removed. If a shift still appears after approval, notify a manager as soon as possible."},
    {h:"Holiday rules to remember", b:"- You may not take more than 8 holiday hours per day\n- You may not take more holiday hours in a week than your normal contracted weekly hours\n- Holiday requests may be declined due to staffing or business needs\n- Holiday taken without approval may be unpaid and treated as unauthorised absence"},
    {h:"Last-minute or emergency holiday", b:"If you need time off urgently:\n- Contact a manager directly as soon as possible\n- Do not rely solely on the app for emergency requests\n- Approval is still required"},
    {h:"Policy: entitlement & accrual", b:"All workers are entitled to a statutory minimum of 5.6 weeks' paid holiday per holiday year.\n\n- Employees can accrue up to 224 holiday hours per year (the statutory minimum for a full-time employee working 40 hours per week).\n- Holiday accrues at a rate of 12.07% of hours worked.\n- Entitlement accrues proportionally throughout the holiday year.\n- Employees are expected to take their holiday within the relevant holiday year."},

window._toggleSec=function(el){ el.closest(".acc-item").classList.toggle("open"); };
function viewRefDoc(doc){
  let h=backbar("Home","#/");
  h+=`<h1 class="page">${esc(doc.title)}</h1><p class="sub">${esc(doc.sub||"")} · ${esc(store.site)}</p>`;
  h+=doc.sections.map((s,i)=>`<div class="acc-item${i===0?' open':''}">
    <button class="acc-h" onclick="window._toggleSec(this)"><span>${esc(s.h)}</span><span class="caret">›</span></button>
    <div class="acc-b">${esc(s.b)}</div></div>`).join("");
  shell(h);
}
function viewDoc(key){
  if(REFDOCS[key]) return viewRefDoc(REFDOCS[key]);
  const d=DOCS[key]||{t:"Coming soon",n:"This section is being built."};
  shell(backbar("Home","#/")+`<h1 class="page">${esc(d.t)}</h1>
    <div class="note-box">${esc(d.n)}</div>
    <p class="muted" style="font-size:14px">This button exists in your current app. I've wired it up in the new app - the content just needs bringing across, which we'll do once Simon confirms where it lives.</p>`);
}
function viewStub(x){ shell(backbar("Home","#/")+`<h1 class="page">Coming soon</h1><div class="note-box">"${esc(x)}" is being built.</div>`); }

/* =========================================================
   ROUTER
   ========================================================= */
function router(){
  const hash=location.hash||"#/";
  const parts=hash.replace(/^#\//,"").split("/");
  const root=parts[0];
  if(root!=="allergens") clearAllergenSubs();
  if(hash!=="#/manage" && _subsUnsub){ try{_subsUnsub()}catch(e){} _subsUnsub=null; }
  if(root!=="records" && _recUnsub){ try{_recUnsub()}catch(e){} _recUnsub=null; }
  if(!store.site && hash!=="#/settings"){ return viewSitePicker(); }
  if(root===""||root===undefined) return viewHome();
  if(root==="settings") return viewSettings();
  if(root==="hub") return viewHub(parts[1]);
  if(root==="eh") return viewEH();
  if(root==="risk") return viewRisk();
  if(root==="records") return viewRecords(parts[1]);
  if(root==="allergens"){
    if(parts[1]==="dish") return viewAllergensDish(parts[2]);
    return viewAllergens(parts[1]);
  }
  if(root==="login") return viewLogin();
  if(root==="mgmt") return viewMgmtHome();
  if(root==="manage") return viewManage();
  if(root==="form") return viewForm(parts[1]);
  if(root==="doc") return viewDoc(parts[1]);
  return viewHome();
}
window.addEventListener("hashchange",router);

/* auth state */
if(auth){
  auth.onAuthStateChanged(u=>{
    if(u && ADMIN_SCOPE[(u.email||"").toLowerCase()]!==undefined){
      manager={email:u.email.toLowerCase(),scope:ADMIN_SCOPE[u.email.toLowerCase()]};
      if(location.hash==="#/login") go("#/mgmt"); else router();
    } else {
      manager=null; router();
    }
  });
}
// first paint - always render immediately, regardless of Firebase
router();
try{ clearTimeout(window.__ldBoot); }catch(e){}
